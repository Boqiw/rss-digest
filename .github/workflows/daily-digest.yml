name: RSS Digest Daily

on:
  schedule:
    # UTC 1:00 = 北京时间 9:00（每天一次）
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 允许 workflow 将 pushed_links.json 提交回仓库

jobs:
  fetch-filter-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 检出代码（包含上一次的 pushed_links.json）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. 抓取 RSS 文章
      - name: Fetch RSS feeds
        run: python fetch_rss.py

      # 5. AI 筛选 + 生成摘要
      - name: AI filter and generate digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python ai_filter.py

      # 6. 推送到 ntfy
      - name: Push to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python push_ntfy.py

      # 7. 持久化状态文件（pushed_links.json + last_run.txt）
      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pushed_links.json last_run.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update pushed_links and last_run [skip ci]"
            git push
          fi
        continue-on-error: true
